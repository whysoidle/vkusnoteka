name: Build Android, Windows and macOS
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: windows
        type: choice
        options: [windows, android, macos, all]
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: pip install --no-deps -e ./backend
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest backend/tests -q
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test --enable-vmservice
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Configure optional release signing
        shell: bash
        env:
          SIGNING_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python scripts/ci-signing.py
      - working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Vkusnoteka-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - shell: pwsh
        run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Vkusnoteka-Windows-Setup
          if-no-files-found: error
          path: |
            dist/Vkusnoteka-Windows-*-Setup.exe
            dist/Vkusnoteka-Windows-*-Portable.zip
            dist/Vkusnoteka-Windows-*.sha256
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: ./scripts/build-macos.sh
      - name: Check macOS Keychain, OCR and native window
        working-directory: app
        run: >-
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/macos CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
      - uses: actions/upload-artifact@v4
        with:
          name: Vkusnoteka-macOS
          path: |
            dist/Vkusnoteka-macOS-*.dmg
            dist/Vkusnoteka-macOS-*.zip
            dist/Vkusnoteka-macOS-*.sha256
