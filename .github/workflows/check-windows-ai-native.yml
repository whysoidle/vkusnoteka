name: Check Windows AI process lifecycle
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe bundled Windows runtime
        shell: pwsh
        run: |
          python scripts/fetch-windows-ai.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime preparation failed' }
          $AiRoot = Join-Path $PWD 'app/build/windows/x64/runner/Release/LocalAI'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = & $VsWhere -latest -products '*' -property installationPath
          $Crt = Get-ChildItem "$VsPath\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          Copy-Item "$($Crt.FullName)\*.dll" $AiRoot
          Push-Location $AiRoot
          try {
            & .\llama-server.exe --version
            Write-Output "Runtime version exit code: $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime could not load' }
          } finally { Pop-Location }
      - name: Check model startup from a Cyrillic path
        run: python scripts/check-windows-ai.py --startup-only
      - name: Build and exercise Windows AI process ownership
        shell: pwsh
        run: |
          cmake -S app/windows/runner/tests -B app/build/windows-ai-tests
          if ($LASTEXITCODE -ne 0) { throw 'AI native test configure failed' }
          cmake --build app/build/windows-ai-tests --config Release
          if ($LASTEXITCODE -ne 0) { throw 'AI native test build failed' }
          ctest --test-dir app/build/windows-ai-tests -C Release --verbose
          if ($LASTEXITCODE -ne 0) { throw 'AI native lifecycle tests failed' }
